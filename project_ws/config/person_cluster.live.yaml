# Overrides for the live sensor. It is denser than the recorded bags and the
# Pi needs a slightly coarser, slower-learning pipeline to stay real-time.
person_cluster_node:
  ros__parameters:
    max_range: 12.0
    leaf_size: 0.08
    bg_alpha: 0.01
    static_threshold: 0.60
    warmup_frames: 15
